name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Secrets phải là REPOSITORY secrets (Settings → Secrets and variables → Actions).
      # Environment secrets chỉ đọc được từ job có khai báo `environment` tương ứng.
      - name: Kiểm tra secrets
        if: ${{ secrets.VITE_SUPABASE_URL == '' || secrets.VITE_SUPABASE_ANON_KEY == '' }}
        run: |
          echo "::error::Thiếu VITE_SUPABASE_URL hoặc VITE_SUPABASE_ANON_KEY."
          echo "Thêm 2 secret này ở Settings → Secrets and variables → Actions → Repository secrets, rồi chạy lại workflow."
          exit 1

      # Pages phải được bật 1 lần: Settings → Pages → Source = GitHub Actions.
      # (Không dùng `enablement: true` vì GITHUB_TOKEN không có quyền admin để tạo Pages site.)
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
